[project]
name = "briefing-agent"
version = "0.1.0"
description = "Research-briefing agent: a bounded think-act-observe-verify loop with strict tool schemas, structured error recovery, a deterministic verifier, cost caps, tracing, and trajectory evals."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Deimos" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "jsonschema>=4.22",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.scripts]
briefing = "briefing_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/briefing_agent"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
