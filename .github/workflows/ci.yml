name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  LLM_PROVIDER: fake
  NETWORK_MODE: fixture

# `llm-evalops` is a path dependency (`../llm-evalops`, see [tool.uv.sources] in pyproject.toml).
# actions/checkout cannot write outside $GITHUB_WORKSPACE, so both repos are checked out side by
# side inside it (briefing-agent/ and llm-evalops/) and every step runs from briefing-agent/.
# The sibling repo must be public; if it is private, add a read-only token as the EVALOPS_TOKEN
# secret.
defaults:
  run:
    working-directory: briefing-agent

jobs:
  lint-test-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: briefing-agent

      - uses: actions/checkout@v4
        with:
          repository: palademian-jose/llm-evalops
          path: llm-evalops
          token: ${{ secrets.EVALOPS_TOKEN || github.token }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: briefing-agent/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: Eval (fake provider, subset, k=3)
        run: uv run python scripts/eval.py --k 3 --subset 12 --out reports --suffix ci

      - name: Eval with fault injection (recovery rate)
        run: uv run python scripts/eval.py --k 1 --subset 12 --faults "fetch_timeout:0.3,search_empty:0.2,fetch_not_found:0.15" --out reports --suffix ci-faults

      - name: Gate against baseline
        run: |
          uv run evalkit gate \
            --baseline reports/baseline.json \
            --candidate reports/latest-ci.json \
            --config evals.yaml \
            --md reports/gate.md \
            --annotate

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            briefing-agent/reports/*.json
            briefing-agent/reports/*.md
